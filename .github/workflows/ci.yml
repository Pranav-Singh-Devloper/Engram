name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        # Keep this tag in sync with docker-compose.yml.
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: engram
          POSTGRES_PASSWORD: engram
          POSTGRES_DB: engram
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U engram -d engram"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://engram:engram@localhost:54329/engram

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # The web app builds (route handlers, workspace packages transpiled).
      - run: pnpm --filter @engram/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # The no-API-key reviewer path doubles as an end-to-end smoke test.
      - run: pnpm demo:offline
      # 20 dev items through all four memory modes, replayed from committed
      # recordings: the real providers, no keys, no network.
      - run: pnpm bench --subset=smoke --offline
      # The same items with nightly consolidation, replaying recorded summaries.
      - run: pnpm bench --subset=smoke --offline --memory=engram_consolidated
      # Bulk session extraction (ADR-015), as the bench and imports use it.
      - run: pnpm bench --subset=smoke --offline --memory=engram --extraction=session

  # The README's reviewer paths, literally, on the pinned Node (P10, ledger
  # row 34): a fresh checkout, no .env and no migrate step for the offline
  # demo; then the quickstart's database steps from .env.example. The
  # Postgres service stands in for `pnpm db:up` (Docker), on the same port.
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: engram
          POSTGRES_PASSWORD: engram
          POSTGRES_DB: engram
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U engram -d engram"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node --version
      - run: pnpm install --frozen-lockfile
      # Path 2: the offline demo, exactly as the README runs it.
      - run: pnpm demo:offline
      # Path 3's database steps, from the example env file.
      - run: cp .env.example .env && pnpm db:migrate
